<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grow Infinity - Personal Finance</title>
    
    <!-- 1. Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 2. Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#6366f1',
                        secondary: '#ec4899',
                    }
                }
            }
        }
    </script>

    <!-- 3. Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(226, 232, 240, 0.6); }
        .dark .glass-panel { background: rgba(30, 41, 59, 0.9); border-bottom: 1px solid rgba(51, 65, 85, 0.6); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>

<body class="bg-gray-50 text-slate-800 dark:bg-slate-900 dark:text-gray-100 min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="w-full glass-panel sticky top-0 z-40 px-6 py-4 shadow-sm">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-tr from-primary to-secondary text-white p-2 rounded-lg shadow-lg">
                    <i class="fa-solid fa-chart-line text-xl"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight">Grow <span class="text-primary font-light">Infinity</span></h1>
            </div>
            <div class="flex items-center gap-4">
                <button id="theme-toggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-slate-700 transition-colors focus:outline-none bg-gray-100 dark:bg-slate-800 border border-gray-200 dark:border-slate-700">
                    <i class="fa-solid fa-moon text-gray-600 dark:text-yellow-400 text-lg transition-transform"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow w-full max-w-5xl mx-auto p-4 sm:p-6 space-y-6">

        <!-- Filters -->
        <div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-gray-100 dark:border-slate-700 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <i class="fa-regular fa-calendar text-primary"></i>
                <h2 class="font-semibold text-sm uppercase tracking-wide text-gray-500 dark:text-gray-400">Filter Range</h2>
            </div>
            <div class="flex gap-2 w-full sm:w-auto">
                <input type="date" id="start-date" class="w-full sm:w-auto bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-600 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-primary outline-none dark:text-white">
                <input type="date" id="end-date" class="w-full sm:w-auto bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-600 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-primary outline-none dark:text-white">
            </div>
        </div>

        <!-- Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-gray-100 dark:border-slate-700">
                <h3 class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Net Balance</h3>
                <p id="balance" class="text-3xl font-bold mt-2 text-slate-800 dark:text-white">₹0.00</p>
            </div>
            <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-gray-100 dark:border-slate-700">
                <h3 class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Income</h3>
                <p id="money-plus" class="text-3xl font-bold mt-2 text-emerald-500">+₹0.00</p>
            </div>
            <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-gray-100 dark:border-slate-700">
                <h3 class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Expense</h3>
                <p id="money-minus" class="text-3xl font-bold mt-2 text-red-500">-₹0.00</p>
            </div>
        </div>

        <!-- Chart -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-lg border border-gray-100 dark:border-slate-700 p-6">
            <h3 class="text-lg font-bold mb-4">Analytics</h3>
            <div class="relative h-64 w-full">
                <canvas id="expenseChart"></canvas>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Form -->
            <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-lg border border-gray-100 dark:border-slate-700 p-6 h-fit sticky top-24 z-10">
                <h3 id="form-title" class="text-lg font-bold mb-4 border-b border-gray-100 dark:border-slate-700 pb-2">Add Transaction</h3>
                <form id="form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Description</label>
                        <input type="text" id="text" placeholder="e.g. Rent" class="w-full px-4 py-3 rounded-lg bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 focus:ring-2 focus:ring-primary outline-none dark:text-white" required />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Amount</label>
                        <div class="relative">
                            <span class="absolute left-4 top-3.5 text-gray-400 text-sm">₹</span>
                            <!-- Added step="0.01" to allow decimals -->
                            <input type="number" id="amount" placeholder="0.00" step="0.01" class="w-full pl-8 pr-4 py-3 rounded-lg bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 focus:ring-2 focus:ring-primary outline-none dark:text-white" required />
                        </div>
                        <p class="text-xs text-gray-400 mt-1">Positive = Income, Negative = Expense</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Date</label>
                        <input type="date" id="transaction-date" class="w-full px-4 py-3 rounded-lg bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 focus:ring-2 focus:ring-primary outline-none dark:text-white" required />
                    </div>
                    
                    <div class="flex gap-2">
                        <button type="submit" id="submit-btn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md transition-all active:scale-95">Add Transaction</button>
                        <button type="button" id="cancel-edit-btn" onclick="cancelEdit()" class="hidden px-4 py-3 bg-gray-200 dark:bg-slate-700 text-gray-600 dark:text-gray-300 font-semibold rounded-lg hover:bg-gray-300 dark:hover:bg-slate-600 transition-colors">Cancel</button>
                    </div>
                </form>
            </div>

            <!-- List -->
            <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-lg border border-gray-100 dark:border-slate-700 p-6 flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold">History</h3>
                    <span class="text-xs text-gray-400" id="record-count">0 records</span>
                </div>
                <div class="overflow-y-auto max-h-[500px]" id="list-container">
                    <ul id="list" class="space-y-3"></ul>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Delete -->
    <div id="delete-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-2xl p-6 w-full max-w-sm transform transition-all scale-100">
            <div class="text-center mb-6">
                <div class="mx-auto w-12 h-12 bg-red-100 dark:bg-red-900/30 rounded-full flex items-center justify-center mb-4">
                    <i class="fa-solid fa-triangle-exclamation text-red-500 text-xl"></i>
                </div>
                <h3 class="text-lg font-bold text-gray-900 dark:text-white">Delete Transaction?</h3>
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-2">This action cannot be undone.</p>
            </div>
            <div class="flex gap-3">
                <button onclick="closeDeleteModal()" class="flex-1 py-2.5 px-4 bg-gray-100 hover:bg-gray-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-gray-700 dark:text-gray-200 font-medium rounded-lg">Cancel</button>
                <button id="confirm-delete-btn" class="flex-1 py-2.5 px-4 bg-red-500 hover:bg-red-600 text-white font-medium rounded-lg shadow-md">Delete</button>
            </div>
        </div>
    </div>

    <!-- PURE JAVASCRIPT LOGIC -->
    <script>
        // --- 1. DOM Elements ---
        const balanceEl = document.getElementById('balance');
        const money_plus = document.getElementById('money-plus');
        const money_minus = document.getElementById('money-minus');
        const list = document.getElementById('list');
        const form = document.getElementById('form');
        const text = document.getElementById('text');
        const amount = document.getElementById('amount');
        const dateInput = document.getElementById('transaction-date');
        const startDateInput = document.getElementById('start-date');
        const endDateInput = document.getElementById('end-date');
        const themeToggle = document.getElementById('theme-toggle');
        const submitBtn = document.getElementById('submit-btn');
        const cancelBtn = document.getElementById('cancel-edit-btn');
        const formTitle = document.getElementById('form-title');
        const deleteModal = document.getElementById('delete-modal');
        const confirmDeleteBtn = document.getElementById('confirm-delete-btn');
        
        // --- 2. State ---
        let transactions = JSON.parse(localStorage.getItem('grow_infinity_transactions')) || [];
        let expenseChart = null;
        let editingID = null;
        let deleteTargetID = null;

        const today = new Date();
        const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
        const formatDate = (d) => d.toISOString().split('T')[0];
        
        startDateInput.value = formatDate(firstDay);
        endDateInput.value = formatDate(today);
        dateInput.value = formatDate(today);

        // --- 3. Theme Logic ---
        const checkTheme = () => {
            const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && sysDark)) {
                document.documentElement.classList.add('dark');
                themeToggle.innerHTML = '<i class="fa-solid fa-sun text-yellow-400 text-lg"></i>';
            } else {
                document.documentElement.classList.remove('dark');
                themeToggle.innerHTML = '<i class="fa-solid fa-moon text-gray-600 text-lg"></i>';
            }
            if(expenseChart) updateChart();
        };
        checkTheme();

        themeToggle.addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                localStorage.setItem('theme', 'light');
            } else {
                localStorage.setItem('theme', 'dark');
            }
            checkTheme();
        });

        // --- 4. Core Functions ---

        function updateLocalStorage() {
            localStorage.setItem('grow_infinity_transactions', JSON.stringify(transactions));
        }

        function generateID() {
            return Math.floor(Math.random() * 100000000);
        }

        function handleFormSubmit(e) {
            e.preventDefault();

            if (text.value.trim() === '' || amount.value.trim() === '') {
                alert('Please add a text and amount');
                return;
            }

            if (editingID) {
                // UPDATE
                const index = transactions.findIndex(t => t.id === editingID);
                if (index !== -1) {
                    transactions[index].text = text.value;
                    transactions[index].amount = +amount.value;
                    transactions[index].date = dateInput.value;
                }
                cancelEdit();
            } else {
                // ADD
                const transaction = {
                    id: generateID(),
                    text: text.value,
                    amount: +amount.value,
                    date: dateInput.value 
                };
                transactions.push(transaction);
                
                text.value = '';
                amount.value = '';
            }

            updateLocalStorage();
            init();
        }

        window.editTransaction = function(id) {
            const item = transactions.find(t => t.id === id);
            if (!item) return;
            text.value = item.text;
            amount.value = item.amount;
            dateInput.value = item.date;
            editingID = id;
            formTitle.innerText = "Edit Transaction";
            submitBtn.innerText = "Update Transaction";
            submitBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700');
            submitBtn.classList.add('bg-orange-500', 'hover:bg-orange-600'); 
            cancelBtn.classList.remove('hidden');
        }

        window.cancelEdit = function() {
            editingID = null;
            text.value = '';
            amount.value = '';
            formTitle.innerText = "Add Transaction";
            submitBtn.innerText = "Add Transaction";
            submitBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-700');
            submitBtn.classList.remove('bg-orange-500', 'hover:bg-orange-600');
            cancelBtn.classList.add('hidden');
        }

        // --- Modal Delete ---
        window.confirmDelete = function(id) {
            deleteTargetID = id;
            deleteModal.classList.remove('hidden');
        }

        confirmDeleteBtn.addEventListener('click', () => {
            if (deleteTargetID !== null) {
                transactions = transactions.filter(t => t.id !== deleteTargetID);
                if (editingID === deleteTargetID) cancelEdit();
                updateLocalStorage();
                init();
                closeDeleteModal();
            }
        });

        window.closeDeleteModal = function() {
            deleteTargetID = null;
            deleteModal.classList.add('hidden');
        }

        function getFilteredTransactions() {
            const start = new Date(startDateInput.value);
            const end = new Date(endDateInput.value);
            start.setHours(0,0,0,0);
            end.setHours(23,59,59,999);

            return transactions.filter(t => {
                const tDate = new Date(t.date); 
                return new Date(t.date) >= start && new Date(t.date) <= end;
            }).sort((a,b) => new Date(b.date) - new Date(a.date));
        }

        function addTransactionDOM(transaction) {
            const sign = transaction.amount < 0 ? '-' : '+';
            const isExp = transaction.amount < 0;
            const itemClass = isExp ? 'border-red-500' : 'border-emerald-500';
            const textClass = isExp ? 'text-red-500' : 'text-emerald-500';
            const icon = isExp ? 'fa-arrow-down' : 'fa-arrow-up';
            const iconBg = isExp ? 'bg-red-100 text-red-500' : 'bg-emerald-100 text-emerald-500';

            const item = document.createElement('li');
            item.className = `bg-white dark:bg-slate-900 border-l-4 ${itemClass} p-4 rounded shadow-sm flex justify-between items-center animate-fade-in group`;

            item.innerHTML = `
                <div class="flex items-center gap-3">
                    <div class="${iconBg} h-10 w-10 rounded-full flex items-center justify-center">
                        <i class="fa-solid ${icon}"></i>
                    </div>
                    <div>
                        <p class="font-bold text-slate-700 dark:text-slate-200">${transaction.text}</p>
                        <p class="text-xs text-gray-400">${transaction.date}</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <span class="${textClass} font-bold text-lg mr-2">${sign}₹${Math.abs(transaction.amount).toFixed(2)}</span>
                    <button class="text-gray-300 hover:text-orange-500 transition-colors p-2" onclick="editTransaction(${transaction.id})" title="Edit">
                        <i class="fa-solid fa-pen"></i>
                    </button>
                    <button class="text-gray-300 hover:text-red-500 transition-colors p-2" onclick="confirmDelete(${transaction.id})" title="Delete">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            `;
            list.appendChild(item);
        }

        function updateValues() {
            const filtered = getFilteredTransactions();
            const amounts = filtered.map(transaction => transaction.amount);
            const total = amounts.reduce((acc, item) => (acc += item), 0).toFixed(2);
            const income = amounts.filter(item => item > 0).reduce((acc, item) => (acc += item), 0).toFixed(2);
            const expense = (amounts.filter(item => item < 0).reduce((acc, item) => (acc += item), 0) * -1).toFixed(2);

            balanceEl.innerText = `₹${total}`;
            money_plus.innerText = `+₹${income}`;
            money_minus.innerText = `-₹${expense}`;
            document.getElementById('record-count').innerText = `${filtered.length} Records`;
        }

        function updateChart() {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            const filtered = getFilteredTransactions();
            const grouped = {};
            filtered.forEach(t => {
                if(!grouped[t.date]) grouped[t.date] = { income: 0, expense: 0 };
                if(t.amount > 0) grouped[t.date].income += t.amount;
                else grouped[t.date].expense += Math.abs(t.amount);
            });
            const labels = Object.keys(grouped).sort();
            const incData = labels.map(l => grouped[l].income);
            const expData = labels.map(l => grouped[l].expense);
            const isDark = document.documentElement.classList.contains('dark');
            const textColor = isDark ? '#cbd5e1' : '#475569';

            if(expenseChart) expenseChart.destroy();

            expenseChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Income', data: incData, backgroundColor: '#10b981', borderRadius: 4 },
                        { label: 'Expense', data: expData, backgroundColor: '#ef4444', borderRadius: 4 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { ticks: { color: textColor }, grid: { display: false } },
                        y: { ticks: { color: textColor }, grid: { color: isDark ? '#334155' : '#e2e8f0' } }
                    },
                    plugins: { legend: { labels: { color: textColor } } }
                }
            });
        }

        function init() {
            list.innerHTML = '';
            const filtered = getFilteredTransactions();
            if(filtered.length === 0) list.innerHTML = `<li class="text-center text-gray-400 py-10">No transactions found.</li>`;
            else filtered.forEach(addTransactionDOM);
            updateValues();
            updateChart();
        }

        form.addEventListener('submit', handleFormSubmit);
        startDateInput.addEventListener('change', init);
        endDateInput.addEventListener('change', init);

        init();
    </script>
</body>
</html>
